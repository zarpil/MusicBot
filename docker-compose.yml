services:
  # ─── Lavalink Audio Server ─────────────────────────────────────────────────
  lavalink:
    build:
      context: ./lavalink
      dockerfile: Dockerfile
    container_name: musicbot-lavalink
    restart: unless-stopped
    env_file: .env
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Djava.net.preferIPv4Stack=true
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./lavalink/data:/opt/Lavalink/data
      - lavalink_data:/opt/Lavalink/logs
    ports:
      - "2333:2333"
    networks:
      - musicbot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Bot + API (single Node.js process) ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicbot-app
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file: .env
    environment:
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    networks:
      - musicbot-net

  # ─── Web Dashboard (Nginx serving built React app) ─────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: musicbot-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "2728:80"
    networks:
      - musicbot-net

networks:
  musicbot-net:
    driver: bridge

volumes:
  lavalink_data:
